<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process a game · Hoops Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@1,800&display=swap">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  .game-pick { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .game-pick select { min-height: 44px; font-weight: 600; min-width: 260px; }
  .footer-line { font-size: 13px; color: var(--muted); }
</style>
</head>
<body class="area-training">
<div class="train-shell">
  <aside class="side-bar" id="side-bar"></aside>
  <main class="train-main">
    <div class="page-head">
      <div class="head-text">
        <a href="dashboard.html" class="back-link">← Dashboard</a>
        <h1 class="title">Process a game</h1>
      </div>
      <div class="head-side">
        <div class="game-pick">
          <label class="label" for="game-pick">Game</label>
          <select id="game-pick" class="input" aria-label="Which game"></select>
          <a href="games.html" class="small">All games</a>
        </div>
      </div>
    </div>

    <section class="card status-card" id="status-card">
      <span class="big" id="status-step">…</span>
      <span id="status-block" class="line"></span>
    </section>

    <div class="step-rows" id="steps"></div>

    <div class="footer-line">When step 5 is done this page shows Open stats and you pick the next game from the list at the top.</div>
  </main>
</div>
<script src="app.js"></script>
<script src="process.js"></script>
</body>
</html>
